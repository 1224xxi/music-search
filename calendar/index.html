<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음악 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --bg: #fbfaf8;
    --card: #f2efe9;
    --accent: #e8927a;
    --accent-soft: #e8927a22;
    --text: #45423e;
    --text-muted: #918c84;
    --border: #e4dfd6;
    --track-badge: #7d94a8;
    --album-badge: #e8927a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', 'Pretendard', sans-serif;
    padding: 28px 12px 80px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  .widget-title-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .widget-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .gear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .gear-btn:hover { border-color: var(--accent); color: var(--accent); }

  .settings-panel {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
    gap: 14px;
    flex-direction: column;
  }
  .settings-panel.open { display: flex; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .setting-row label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }
  .setting-row input[type="color"] {
    width: 40px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    padding: 2px;
  }
  .settings-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .reset-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .cal-header h1 {
    font-family: 'DM Sans', 'Pretendard', sans-serif;
    font-weight: 700;
    font-size: 22px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .cal-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }
  .cal-nav button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
  }
  .cal-nav .today-btn {
    width: auto;
    border-radius: 14px;
    padding: 0 12px;
    cursor: pointer;
  }
  .cal-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    min-height: 16px;
    margin-bottom: 10px;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .dow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    padding-bottom: 4px;
  }
  .cell {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    height: 96px;
    padding: 6px 7px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .cell:hover { border-color: var(--accent); }
  .cell.empty { background: transparent; border: none; cursor: default; }
  .cell.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .daynum {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
  .cell.today .daynum { color: var(--accent); font-weight: 600; }

  .entries {
    display: flex;
    flex-direction: column;
    gap: 3px;
    overflow-y: auto;
    height: 66px;
  }
  .entry {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    line-height: 1.3;
    flex-shrink: 0;
  }
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 8px;
    font-weight: 600;
    padding: 0px 3px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .badge.t { color: var(--track-badge); background: #7d94a81a; }
  .badge.a { color: var(--album-badge); background: #e8927a1a; }
  .entry-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    color: var(--text);
  }

  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(60, 55, 48, 0.35);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--bg);
    border-radius: 16px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
  }
  .modal-title {
    font-family: 'DM Sans', 'Pretendard', sans-serif;
    font-weight: 700;
    font-size: 18px;
    margin: 0 0 14px;
  }
  .detail-card {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .detail-card:last-child { border-bottom: none; }
  .detail-card img {
    width: 56px; height: 56px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .detail-meta { flex: 1; min-width: 0; }
  .detail-title-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .detail-title { font-weight: 700; font-size: 14px; }
  .detail-artist { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .detail-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.6;
  }
  .detail-sub b { color: var(--text); font-weight: 600; }
  .close-btn {
    margin-top: 16px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 10px;
    font-family: 'DM Sans', 'Pretendard', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="widget-title-bar">
    <span class="widget-name">음악 캘린더</span>
    <button class="gear-btn" id="gearBtn" title="색상 설정">⚙</button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="setting-row">
      <label>배경 색</label>
      <input type="color" id="bgColor">
    </div>
    <div class="setting-row">
      <label>카드 배경 색</label>
      <input type="color" id="cardColor">
    </div>
    <div class="setting-row">
      <label>포인트 색</label>
      <input type="color" id="accentColor">
    </div>
    <div class="setting-row">
      <label>글자 색</label>
      <input type="color" id="textColor">
    </div>
    <div class="settings-actions">
      <button class="reset-btn" id="resetColors">기본값으로</button>
      <button class="reset-btn" id="copyColorLink">이 설정으로 링크 복사</button>
    </div>
  </div>

  <div class="cal-header">
    <h1 id="monthTitle">2026년 7월</h1>
    <div class="cal-nav">
      <button id="prevMonth">‹</button>
      <span class="today-btn" id="todayBtn">오늘로</span>
      <button id="nextMonth">›</button>
    </div>
  </div>
  <div class="cal-status" id="calStatus"></div>

  <div class="grid" id="calGrid"></div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <p class="modal-title" id="modalTitle">7월 25일 기록</p>
    <div id="modalBody"></div>
    <button class="close-btn" id="closeModal">닫기</button>
  </div>
</div>

<script>
// ---- 색상 설정 (URL 파라미터 우선, localStorage 보조) ----
const DEFAULT_COLORS = {
  bg: '#fbfaf8',
  card: '#f2efe9',
  accent: '#e8927a',
  text: '#45423e',
};

const gearBtn = document.getElementById('gearBtn');
const settingsPanel = document.getElementById('settingsPanel');
const bgColorInput = document.getElementById('bgColor');
const cardColorInput = document.getElementById('cardColor');
const accentColorInput = document.getElementById('accentColor');
const textColorInput = document.getElementById('textColor');
const resetColorsBtn = document.getElementById('resetColors');

function hexToRgba(hex, alpha) {
  const clean = hex.replace('#', '');
  const bigint = parseInt(clean, 16);
  const r = (bigint >> 16) & 255;
  const g = (bigint >> 8) & 255;
  const b = bigint & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function applyColors(colors) {
  const root = document.documentElement.style;
  root.setProperty('--bg', colors.bg);
  root.setProperty('--card', colors.card);
  root.setProperty('--accent', colors.accent);
  root.setProperty('--accent-soft', hexToRgba(colors.accent, 0.13));
  root.setProperty('--album-badge', colors.accent);
  root.setProperty('--text', colors.text);
  bgColorInput.value = colors.bg;
  cardColorInput.value = colors.card;
  accentColorInput.value = colors.accent;
  textColorInput.value = colors.text;
}

function loadColors() {
  const params = new URLSearchParams(window.location.search);
  if (params.has('accent')) {
    return {
      bg: '#' + (params.get('bg') || DEFAULT_COLORS.bg.replace('#', '')),
      card: '#' + (params.get('card') || DEFAULT_COLORS.card.replace('#', '')),
      accent: '#' + (params.get('accent') || DEFAULT_COLORS.accent.replace('#', '')),
      text: '#' + (params.get('text') || DEFAULT_COLORS.text.replace('#', '')),
    };
  }
  try {
    const saved = JSON.parse(localStorage.getItem('calendarViewColors'));
    return saved ? { ...DEFAULT_COLORS, ...saved } : { ...DEFAULT_COLORS };
  } catch (e) {
    return { ...DEFAULT_COLORS };
  }
}

function saveColors(colors) {
  localStorage.setItem('calendarViewColors', JSON.stringify(colors));
}

let currentColors = loadColors();
applyColors(currentColors);

gearBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
});

[['bg', bgColorInput], ['card', cardColorInput], ['accent', accentColorInput], ['text', textColorInput]].forEach(([key, input]) => {
  input.addEventListener('input', () => {
    currentColors[key] = input.value;
    applyColors(currentColors);
    saveColors(currentColors);
  });
});

resetColorsBtn.addEventListener('click', () => {
  currentColors = { ...DEFAULT_COLORS };
  applyColors(currentColors);
  saveColors(currentColors);
});

document.getElementById('copyColorLink').addEventListener('click', async () => {
  const base = window.location.origin + window.location.pathname;
  const params = new URLSearchParams({
    bg: currentColors.bg.replace('#', ''),
    card: currentColors.card.replace('#', ''),
    accent: currentColors.accent.replace('#', ''),
    text: currentColors.text.replace('#', ''),
  });
  const link = `${base}?${params.toString()}`;
  try {
    await navigator.clipboard.writeText(link);
    alert('링크 복사됨 — Notion 임베드 URL을 이걸로 바꿔주세요');
  } catch (e) {
    prompt('복사 실패, 아래 링크를 직접 복사하세요', link);
  }
});

// ---- Worker 연결 정보 (검색 위젯과 같은 Worker를 씀) ----
const WORKER_URL = 'https://music-search-proxy.jiyeonsung-jys.workers.dev';
const WORKER_SECRET = 'jys.2180';

const dows = ['월', '화', '수', '목', '금', '토', '일'];
const calGrid = document.getElementById('calGrid');
const monthTitle = document.getElementById('monthTitle');
const calStatus = document.getElementById('calStatus');
const overlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth() + 1; // 1~12
let monthData = { days: {}, albums: [] };

async function loadMonth(year, month) {
  if (!WORKER_URL || WORKER_SECRET.includes('여기에')) {
    calStatus.textContent = 'widget 코드 상단의 WORKER_URL / WORKER_SECRET을 먼저 채워주세요';
    return;
  }
  calStatus.textContent = '불러오는 중...';
  const monthStr = `${year}-${String(month).padStart(2, '0')}`;
  try {
    const res = await fetch(`${WORKER_URL}?secret=${encodeURIComponent(WORKER_SECRET)}&month=${monthStr}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '불러오기 실패');
    monthData = data;
    calStatus.textContent = '';
  } catch (err) {
    calStatus.textContent = '불러오기 실패: ' + err.message;
    monthData = { days: {}, albums: [] };
  }
  renderCalendar();
}

function renderCalendar() {
  monthTitle.textContent = `${viewYear}년 ${viewMonth}월`;
  calGrid.innerHTML = '';

  dows.forEach(d => {
    const el = document.createElement('div');
    el.className = 'dow';
    el.textContent = d;
    calGrid.appendChild(el);
  });

  const firstOfMonth = new Date(viewYear, viewMonth - 1, 1);
  const firstWeekday = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
  const isCurrentMonth = viewYear === now.getFullYear() && viewMonth === now.getMonth() + 1;
  const todayDate = now.getDate();

  for (let i = 0; i < firstWeekday; i++) {
    const el = document.createElement('div');
    el.className = 'cell empty';
    calGrid.appendChild(el);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const cell = document.createElement('div');
    cell.className = 'cell' + (isCurrentMonth && day === todayDate ? ' today' : '');

    const num = document.createElement('div');
    num.className = 'daynum';
    num.textContent = day;
    cell.appendChild(num);

    const entries = monthData.days?.[day];
    if (entries && entries.length > 0) {
      const entriesWrap = document.createElement('div');
      entriesWrap.className = 'entries';
      entries.forEach(e => {
        const row = document.createElement('div');
        row.className = 'entry';
        row.innerHTML = `
          <span class="badge ${e.type}">${e.type}</span>
          <span class="entry-text">${e.title} - ${e.artist}</span>
        `;
        entriesWrap.appendChild(row);
      });
      cell.appendChild(entriesWrap);
      cell.addEventListener('click', () => openModal(day, entries));
    }

    calGrid.appendChild(cell);
  }
}

function openModal(day, entries) {
  modalTitle.textContent = `${viewYear}년 ${viewMonth}월 ${day}일 기록`;

  modalBody.innerHTML = entries.map(d => `
    <div class="detail-card" ${d.pageUrl ? `onclick="window.open('${d.pageUrl}', '_blank')" style="cursor:pointer"` : ''}>
      ${d.cover ? `<img src="${d.cover}">` : ''}
      <div class="detail-meta">
        <div class="detail-title-row">
          <span class="badge ${d.type}">${d.type}</span>
          <span class="detail-title">${d.title}</span>
        </div>
        <div class="detail-artist">${d.artist || ''}</div>
        <div class="detail-sub">
          <b>발매일</b> ${d.releaseDate || '—'} &nbsp; <b>분류</b> ${d.category || '—'} &nbsp; <b>평점</b> ${d.rating ?? '—'}<br>
          ${d.albumOf ? `<b>소속 앨범</b> ${d.albumOf}<br>` : ''}
          ${d.trackList ? `<b>트랙 목록</b> ${d.trackList}<br>` : ''}
          ${d.memo ? `<b>메모</b> ${d.memo}` : ''}
        </div>
      </div>
    </div>
  `).join('');

  overlay.classList.remove('hidden');
}

document.getElementById('closeModal').addEventListener('click', () => {
  overlay.classList.add('hidden');
});
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) overlay.classList.add('hidden');
});

document.getElementById('prevMonth').addEventListener('click', () => {
  viewMonth -= 1;
  if (viewMonth < 1) { viewMonth = 12; viewYear -= 1; }
  loadMonth(viewYear, viewMonth);
});

document.getElementById('nextMonth').addEventListener('click', () => {
  viewMonth += 1;
  if (viewMonth > 12) { viewMonth = 1; viewYear += 1; }
  loadMonth(viewYear, viewMonth);
});

document.getElementById('todayBtn').addEventListener('click', () => {
  viewYear = now.getFullYear();
  viewMonth = now.getMonth() + 1;
  loadMonth(viewYear, viewMonth);
});

loadMonth(viewYear, viewMonth);
</script>
</body>
</html>
