<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>음악 캘린더</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --bg: #fbfaf8;
    --card: #f2efe9;
    --accent: #e8927a;
    --accent-soft: #e8927a22;
    --text: #45423e;
    --text-muted: #918c84;
    --border: #e4dfd6;
    --track-badge: #7d94a8;
    --album-badge: #e8927a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', 'Pretendard', sans-serif;
    padding: 20px 16px 80px;
  }
  .wrap { max-width: 1000px; margin: 0 auto; }

  .widget-title-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .widget-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .gear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .gear-btn:hover { border-color: var(--accent); color: var(--accent); }

  .settings-panel {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
    gap: 14px;
    flex-direction: column;
  }
  .settings-panel.open { display: flex; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .setting-row label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }
  .setting-row input[type="color"] {
    width: 40px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    padding: 2px;
  }
  .settings-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .reset-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  /* ---- 레이아웃: 왼쪽 미니 캘린더 + 오른쪽 리스트 ---- */
  .layout {
    display: flex;
    gap: 28px;
    align-items: flex-start;
  }
  .sidebar {
    width: 260px;
    flex-shrink: 0;
    position: sticky;
    top: 20px;
  }
  .agenda-wrap {
    flex: 1;
    min-width: 0;
  }
  @media (max-width: 720px) {
    .layout { flex-direction: column; }
    .sidebar { width: 100%; position: static; }
  }

  /* ---- 미니 캘린더 ---- */
  .mini-cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .mini-cal-header h1 {
    font-family: 'DM Sans', 'Pretendard', sans-serif;
    font-weight: 700;
    font-size: 24px;
    margin: 0;
    color: var(--accent);
  }
  .mini-cal-controls {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .mini-cal-controls button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
    width: 24px; height: 24px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 12px;
  }
  .mini-cal-controls .today-btn {
    width: auto;
    border-radius: 12px;
    padding: 0 9px;
    height: 24px;
    cursor: pointer;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border);
  }

  .mini-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    row-gap: 6px;
  }
  .mini-dow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    padding-bottom: 6px;
  }
  .mini-date {
    aspect-ratio: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: 14px;
    color: var(--text);
    cursor: default;
    position: relative;
  }
  .mini-date .num {
    width: 30px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
  }
  .mini-date.has-entry { cursor: pointer; font-weight: 600; }
  .mini-date.today .num { background: var(--accent); color: #fff; font-weight: 700; }
  .mini-date.selected:not(.today) .num { background: var(--accent-soft); }
  .mini-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0;
    position: absolute;
    bottom: 0;
  }
  .mini-date.today .mini-dot { background: #fff; }
  .mini-date.has-entry .mini-dot { opacity: 1; }

  .status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    min-height: 16px;
    margin-bottom: 10px;
  }

  /* ---- 아젠다 리스트 ---- */
  .agenda { display: flex; flex-direction: column; gap: 14px; }
  .agenda-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 6px;
    padding-left: 2px;
  }
  .agenda-date.today-label { color: var(--accent); font-weight: 600; }
  .agenda-card {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .agenda-card:hover { border-color: var(--accent); }
  .agenda-card img {
    width: 40px; height: 40px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--border);
  }
  .agenda-meta { flex: 1; min-width: 0; }
  .agenda-title-row { display: flex; align-items: center; gap: 6px; }
  .agenda-title {
    font-size: 14px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .agenda-artist {
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  .badge {
    font-family: 'JetBrains Mono', monospace;
    font-size: 9px;
    font-weight: 600;
    padding: 1px 4px;
    border-radius: 3px;
    flex-shrink: 0;
  }
  .badge.t { color: var(--track-badge); background: #7d94a81a; }
  .badge.a { color: var(--album-badge); background: #e8927a1a; }

  .empty-month {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    line-height: 1.8;
  }

  /* ---- 모달 ---- */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(60, 55, 48, 0.35);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    z-index: 50;
  }
  .modal-overlay.hidden { display: none; }
  .modal {
    background: var(--bg);
    border-radius: 16px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
    padding: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.15);
  }
  .modal-title {
    font-family: 'DM Sans', 'Pretendard', sans-serif;
    font-weight: 700;
    font-size: 18px;
    margin: 0 0 14px;
  }
  .detail-card {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .detail-card:last-child { border-bottom: none; }
  .detail-card img {
    width: 56px; height: 56px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
  }
  .detail-meta { flex: 1; min-width: 0; }
  .detail-title-row { display: flex; align-items: center; gap: 6px; }
  .detail-title { font-weight: 700; font-size: 14px; }
  .detail-artist { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
  .detail-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    color: var(--text-muted);
    margin-top: 6px;
    line-height: 1.6;
  }
  .detail-sub b { color: var(--text); font-weight: 600; }
  .close-btn {
    margin-top: 16px;
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px;
    border-radius: 10px;
    font-family: 'DM Sans', 'Pretendard', sans-serif;
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="widget-title-bar">
    <span class="widget-name">음악 캘린더</span>
    <button class="gear-btn" id="gearBtn" title="색상 설정">⚙</button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="setting-row">
      <label>배경 색</label>
      <input type="color" id="bgColor">
    </div>
    <div class="setting-row">
      <label>카드 배경 색</label>
      <input type="color" id="cardColor">
    </div>
    <div class="setting-row">
      <label>포인트 색</label>
      <input type="color" id="accentColor">
    </div>
    <div class="setting-row">
      <label>글자 색</label>
      <input type="color" id="textColor">
    </div>
    <div class="settings-actions">
      <button class="reset-btn" id="resetColors">기본값으로</button>
      <button class="reset-btn" id="copyColorLink">이 설정으로 링크 복사</button>
    </div>
  </div>

  <div class="layout">
    <div class="sidebar">
      <div class="mini-cal-header">
        <h1 id="monthTitle">8월</h1>
        <div class="mini-cal-controls">
          <button id="prevMonth">‹</button>
          <span class="today-btn" id="todayBtn">오늘</span>
          <button id="nextMonth">›</button>
        </div>
      </div>
      <div class="mini-grid" id="miniGrid"></div>
      <div class="status" id="calStatus"></div>
    </div>

    <div class="agenda-wrap">
      <div class="agenda" id="agenda"></div>
    </div>
  </div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal">
    <p class="modal-title" id="modalTitle">7월 25일 기록</p>
    <div id="modalBody"></div>
    <button class="close-btn" id="closeModal">닫기</button>
  </div>
</div>

<script>
const DEFAULT_COLORS = {
  bg: '#fbfaf8',
  card: '#f2efe9',
  accent: '#e8927a',
  text: '#45423e',
};

const gearBtn = document.getElementById('gearBtn');
const settingsPanel = document.getElementById('settingsPanel');
const bgColorInput = document.getElementById('bgColor');
const cardColorInput = document.getElementById('cardColor');
const accentColorInput = document.getElementById('accentColor');
const textColorInput = document.getElementById('textColor');
const resetColorsBtn = document.getElementById('resetColors');

function hexToRgba(hex, alpha) {
  const clean = hex.replace('#', '');
  const bigint = parseInt(clean, 16);
  const r = (bigint >> 16) & 255;
  const g = (bigint >> 8) & 255;
  const b = bigint & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function applyColors(colors) {
  const root = document.documentElement.style;
  root.setProperty('--bg', colors.bg);
  root.setProperty('--card', colors.card);
  root.setProperty('--accent', colors.accent);
  root.setProperty('--accent-soft', hexToRgba(colors.accent, 0.15));
  root.setProperty('--album-badge', colors.accent);
  root.setProperty('--text', colors.text);
  bgColorInput.value = colors.bg;
  cardColorInput.value = colors.card;
  accentColorInput.value = colors.accent;
  textColorInput.value = colors.text;
}

function loadColors() {
  const params = new URLSearchParams(window.location.search);
  if (params.has('accent')) {
    return {
      bg: '#' + (params.get('bg') || DEFAULT_COLORS.bg.replace('#', '')),
      card: '#' + (params.get('card') || DEFAULT_COLORS.card.replace('#', '')),
      accent: '#' + (params.get('accent') || DEFAULT_COLORS.accent.replace('#', '')),
      text: '#' + (params.get('text') || DEFAULT_COLORS.text.replace('#', '')),
    };
  }
  try {
    const saved = JSON.parse(localStorage.getItem('calendarViewColors'));
    return saved ? { ...DEFAULT_COLORS, ...saved } : { ...DEFAULT_COLORS };
  } catch (e) {
    return { ...DEFAULT_COLORS };
  }
}

function saveColors(colors) {
  localStorage.setItem('calendarViewColors', JSON.stringify(colors));
}

let currentColors = loadColors();
applyColors(currentColors);

gearBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
});

[['bg', bgColorInput], ['card', cardColorInput], ['accent', accentColorInput], ['text', textColorInput]].forEach(([key, input]) => {
  input.addEventListener('input', () => {
    currentColors[key] = input.value;
    applyColors(currentColors);
    saveColors(currentColors);
  });
});

resetColorsBtn.addEventListener('click', () => {
  currentColors = { ...DEFAULT_COLORS };
  applyColors(currentColors);
  saveColors(currentColors);
});

document.getElementById('copyColorLink').addEventListener('click', async () => {
  const base = window.location.origin + window.location.pathname;
  const params = new URLSearchParams({
    bg: currentColors.bg.replace('#', ''),
    card: currentColors.card.replace('#', ''),
    accent: currentColors.accent.replace('#', ''),
    text: currentColors.text.replace('#', ''),
  });
  const link = `${base}?${params.toString()}`;
  try {
    await navigator.clipboard.writeText(link);
    alert('링크 복사됨 — Notion 임베드 URL을 이걸로 바꿔주세요');
  } catch (e) {
    prompt('복사 실패, 아래 링크를 직접 복사하세요', link);
  }
});

const WORKER_URL = 'https://music-search-proxy.jiyeonsung-jys.workers.dev';
const WORKER_SECRET = 'jys.2180';

const monthTitle = document.getElementById('monthTitle');
const calStatus = document.getElementById('calStatus');
const miniGrid = document.getElementById('miniGrid');
const agenda = document.getElementById('agenda');
const overlay = document.getElementById('modalOverlay');
const modalTitle = document.getElementById('modalTitle');
const modalBody = document.getElementById('modalBody');

const dows = ['월', '화', '수', '목', '금', '토', '일'];
const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth() + 1;
let selectedDay = null;
let monthData = { days: {}, albums: [] };

async function loadMonth(year, month) {
  monthTitle.textContent = `${month}월`;
  if (!WORKER_URL || WORKER_SECRET.includes('여기에')) {
    calStatus.textContent = 'widget 코드 상단의 WORKER_URL / WORKER_SECRET을 먼저 채워주세요';
    return;
  }
  calStatus.textContent = '불러오는 중...';
  const monthStr = `${year}-${String(month).padStart(2, '0')}`;
  try {
    const res = await fetch(`${WORKER_URL}?secret=${encodeURIComponent(WORKER_SECRET)}&month=${monthStr}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '불러오기 실패');
    monthData = data;
    calStatus.textContent = '';
  } catch (err) {
    calStatus.textContent = '불러오기 실패: ' + err.message;
    monthData = { days: {}, albums: [] };
  }
  selectedDay = null;
  renderMiniGrid();
  renderAgenda();
}

function renderMiniGrid() {
  miniGrid.innerHTML = '';
  dows.forEach(d => {
    const el = document.createElement('div');
    el.className = 'mini-dow';
    el.textContent = d;
    miniGrid.appendChild(el);
  });

  const firstOfMonth = new Date(viewYear, viewMonth - 1, 1);
  const firstWeekday = (firstOfMonth.getDay() + 6) % 7;
  const daysInMonth = new Date(viewYear, viewMonth, 0).getDate();
  const isCurrentMonth = viewYear === now.getFullYear() && viewMonth === now.getMonth() + 1;
  const todayDate = now.getDate();

  for (let i = 0; i < firstWeekday; i++) {
    const el = document.createElement('div');
    el.className = 'mini-date';
    miniGrid.appendChild(el);
  }

  for (let day = 1; day <= daysInMonth; day++) {
    const hasEntry = !!(monthData.days?.[day] && monthData.days[day].length > 0);
    const isToday = isCurrentMonth && day === todayDate;
    const el = document.createElement('div');
    el.className = 'mini-date' + (hasEntry ? ' has-entry' : '') + (isToday ? ' today' : '') + (selectedDay === day ? ' selected' : '');
    el.innerHTML = `<span class="num">${day}</span><span class="mini-dot"></span>`;
    if (hasEntry) {
      el.addEventListener('click', () => {
        selectedDay = day;
        renderMiniGrid();
        const target = document.getElementById(`agenda-day-${day}`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    }
    miniGrid.appendChild(el);
  }
}

function renderAgenda() {
  agenda.innerHTML = '';
  const days = Object.keys(monthData.days || {}).map(Number).sort((a, b) => b - a);

  if (days.length === 0) {
    agenda.innerHTML = '<div class="empty-month">이 달엔 기록이 없어요</div>';
    return;
  }

  const isCurrentMonth = viewYear === now.getFullYear() && viewMonth === now.getMonth() + 1;
  const todayDate = now.getDate();

  days.forEach(day => {
    const group = document.createElement('div');
    group.className = 'agenda-group';
    group.id = `agenda-day-${day}`;

    const isToday = isCurrentMonth && day === todayDate;
    const dateLabel = document.createElement('div');
    dateLabel.className = 'agenda-date' + (isToday ? ' today-label' : '');
    dateLabel.textContent = `${viewMonth}월 ${day}일${isToday ? ' · 오늘' : ''}`;
    group.appendChild(dateLabel);

    monthData.days[day].forEach(e => {
      const card = document.createElement('div');
      card.className = 'agenda-card';
      card.innerHTML = `
        ${e.cover ? `<img src="${e.cover}">` : ''}
        <div class="agenda-meta">
          <div class="agenda-title-row">
            <span class="badge ${e.type}">${e.type}</span>
            <span class="agenda-title">${e.title}</span>
          </div>
          <div class="agenda-artist">${e.artist || ''}</div>
        </div>
      `;
      card.addEventListener('click', () => openModal(day, monthData.days[day]));
      group.appendChild(card);
    });

    agenda.appendChild(group);
  });
}

function openModal(day, entries) {
  modalTitle.textContent = `${viewYear}년 ${viewMonth}월 ${day}일 기록`;

  modalBody.innerHTML = entries.map(d => `
    <div class="detail-card" ${d.pageUrl ? `onclick="window.open('${d.pageUrl}', '_blank')" style="cursor:pointer"` : ''}>
      ${d.cover ? `<img src="${d.cover}">` : ''}
      <div class="detail-meta">
        <div class="detail-title-row">
          <span class="badge ${d.type}">${d.type}</span>
          <span class="detail-title">${d.title}</span>
        </div>
        <div class="detail-artist">${d.artist || ''}</div>
        <div class="detail-sub">
          <b>발매일</b> ${d.releaseDate || '—'} &nbsp; <b>분류</b> ${d.category || '—'} &nbsp; <b>평점</b> ${d.rating ?? '—'}<br>
          ${d.albumOf ? `<b>소속 앨범</b> ${d.albumOf}<br>` : ''}
          ${d.trackList ? `<b>트랙 목록</b> ${d.trackList}<br>` : ''}
          ${d.memo ? `<b>메모</b> ${d.memo}<br>` : ''}
          ${d.logMemo ? `<b>이날의 메모</b> ${d.logMemo}` : ''}
        </div>
      </div>
    </div>
  `).join('');

  overlay.classList.remove('hidden');
}

document.getElementById('closeModal').addEventListener('click', () => {
  overlay.classList.add('hidden');
});
overlay.addEventListener('click', (e) => {
  if (e.target === overlay) overlay.classList.add('hidden');
});

document.getElementById('prevMonth').addEventListener('click', () => {
  viewMonth -= 1;
  if (viewMonth < 1) { viewMonth = 12; viewYear -= 1; }
  loadMonth(viewYear, viewMonth);
});

document.getElementById('nextMonth').addEventListener('click', () => {
  viewMonth += 1;
  if (viewMonth > 12) { viewMonth = 1; viewYear += 1; }
  loadMonth(viewYear, viewMonth);
});

document.getElementById('todayBtn').addEventListener('click', () => {
  viewYear = now.getFullYear();
  viewMonth = now.getMonth() + 1;
  loadMonth(viewYear, viewMonth);
});

loadMonth(viewYear, viewMonth);
</script>
</body>
</html>
