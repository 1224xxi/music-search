<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이달의 앨범</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css" />
<style>
  :root {
    --bg: #fbfaf8;
    --card: #f2efe9;
    --accent: #e8927a;
    --text: #45423e;
    --text-muted: #918c84;
    --border: #e4dfd6;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', 'Pretendard', sans-serif;
    padding: 28px 12px 80px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  .widget-title-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 14px;
  }
  .widget-name {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.02em;
  }
  .gear-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-muted);
    width: 30px;
    height: 30px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.15s;
  }
  .gear-btn:hover { border-color: var(--accent); color: var(--accent); }

  .settings-panel {
    display: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 18px;
    gap: 14px;
    flex-direction: column;
  }
  .settings-panel.open { display: flex; }
  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .setting-row label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }
  .setting-row input[type="color"] {
    width: 40px;
    height: 32px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: transparent;
    cursor: pointer;
    padding: 2px;
  }
  .settings-actions {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .reset-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--accent); color: var(--accent); }

  .cal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .cal-header h1 {
    font-family: 'DM Sans', 'Pretendard', sans-serif;
    font-weight: 700;
    font-size: 20px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .cal-nav {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-muted);
  }
  .cal-nav button {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
    width: 28px; height: 28px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 13px;
  }
  .cal-nav .today-btn {
    width: auto;
    border-radius: 14px;
    padding: 0 12px;
    cursor: pointer;
  }
  .cal-status {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
    min-height: 16px;
    margin-bottom: 10px;
  }

  .section-divider {
    margin: 4px 0 18px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .section-divider .line { height: 1px; background: var(--border); flex: 1; }
  .album-count {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--text-muted);
  }
  .album-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }
  .album-cover {
    aspect-ratio: 1;
    border-radius: 8px;
    overflow: hidden;
    background: var(--card);
    border: 1px solid var(--border);
  }
  .album-cover img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  @media (max-width: 480px) {
    .album-grid { grid-template-columns: repeat(4, 1fr); }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="widget-title-bar">
    <span class="widget-name">이달의 앨범</span>
    <button class="gear-btn" id="gearBtn" title="색상 설정">⚙</button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="setting-row">
      <label>배경 색</label>
      <input type="color" id="bgColor">
    </div>
    <div class="setting-row">
      <label>카드 배경 색</label>
      <input type="color" id="cardColor">
    </div>
    <div class="setting-row">
      <label>포인트 색</label>
      <input type="color" id="accentColor">
    </div>
    <div class="setting-row">
      <label>글자 색</label>
      <input type="color" id="textColor">
    </div>
    <div class="settings-actions">
      <button class="reset-btn" id="resetColors">기본값으로</button>
      <button class="reset-btn" id="copyColorLink">이 설정으로 링크 복사</button>
    </div>
  </div>

  <div class="cal-header">
    <h1 id="monthTitle">2026년 7월</h1>
    <div class="cal-nav">
      <button id="prevMonth">‹</button>
      <span class="today-btn" id="todayBtn">오늘로</span>
      <button id="nextMonth">›</button>
    </div>
  </div>
  <div class="cal-status" id="calStatus"></div>

  <div class="section-divider">
    <div class="line"></div>
    <span class="album-count" id="albumCount">0장</span>
  </div>
  <div class="album-grid" id="albumGrid"></div>
</div>

<script>
// ---- 색상 설정 (URL 파라미터 우선, localStorage 보조) ----
const DEFAULT_COLORS = {
  bg: '#fbfaf8',
  card: '#f2efe9',
  accent: '#e8927a',
  text: '#45423e',
};

const gearBtn = document.getElementById('gearBtn');
const settingsPanel = document.getElementById('settingsPanel');
const bgColorInput = document.getElementById('bgColor');
const cardColorInput = document.getElementById('cardColor');
const accentColorInput = document.getElementById('accentColor');
const textColorInput = document.getElementById('textColor');
const resetColorsBtn = document.getElementById('resetColors');

function applyColors(colors) {
  const root = document.documentElement.style;
  root.setProperty('--bg', colors.bg);
  root.setProperty('--card', colors.card);
  root.setProperty('--accent', colors.accent);
  root.setProperty('--text', colors.text);
  bgColorInput.value = colors.bg;
  cardColorInput.value = colors.card;
  accentColorInput.value = colors.accent;
  textColorInput.value = colors.text;
}

function loadColors() {
  const params = new URLSearchParams(window.location.search);
  if (params.has('accent')) {
    return {
      bg: '#' + (params.get('bg') || DEFAULT_COLORS.bg.replace('#', '')),
      card: '#' + (params.get('card') || DEFAULT_COLORS.card.replace('#', '')),
      accent: '#' + (params.get('accent') || DEFAULT_COLORS.accent.replace('#', '')),
      text: '#' + (params.get('text') || DEFAULT_COLORS.text.replace('#', '')),
    };
  }
  try {
    const saved = JSON.parse(localStorage.getItem('albumTrackerColors'));
    return saved ? { ...DEFAULT_COLORS, ...saved } : { ...DEFAULT_COLORS };
  } catch (e) {
    return { ...DEFAULT_COLORS };
  }
}

function saveColors(colors) {
  localStorage.setItem('albumTrackerColors', JSON.stringify(colors));
}

let currentColors = loadColors();
applyColors(currentColors);

gearBtn.addEventListener('click', () => {
  settingsPanel.classList.toggle('open');
});

[['bg', bgColorInput], ['card', cardColorInput], ['accent', accentColorInput], ['text', textColorInput]].forEach(([key, input]) => {
  input.addEventListener('input', () => {
    currentColors[key] = input.value;
    applyColors(currentColors);
    saveColors(currentColors);
  });
});

resetColorsBtn.addEventListener('click', () => {
  currentColors = { ...DEFAULT_COLORS };
  applyColors(currentColors);
  saveColors(currentColors);
});

document.getElementById('copyColorLink').addEventListener('click', async () => {
  const base = window.location.origin + window.location.pathname;
  const params = new URLSearchParams({
    bg: currentColors.bg.replace('#', ''),
    card: currentColors.card.replace('#', ''),
    accent: currentColors.accent.replace('#', ''),
    text: currentColors.text.replace('#', ''),
  });
  const link = `${base}?${params.toString()}`;
  try {
    await navigator.clipboard.writeText(link);
    alert('링크 복사됨 — Notion 임베드 URL을 이걸로 바꿔주세요');
  } catch (e) {
    prompt('복사 실패, 아래 링크를 직접 복사하세요', link);
  }
});

// ---- Worker 연결 정보 (검색/캘린더 위젯과 같은 Worker를 씀) ----
const WORKER_URL = 'https://music-search-proxy.jiyeonsung-jys.workers.dev';
const WORKER_SECRET = 'jys.2180';

const monthTitle = document.getElementById('monthTitle');
const calStatus = document.getElementById('calStatus');
const albumGrid = document.getElementById('albumGrid');
const albumCount = document.getElementById('albumCount');

const now = new Date();
let viewYear = now.getFullYear();
let viewMonth = now.getMonth() + 1;

async function loadMonth(year, month) {
  monthTitle.textContent = `${year}년 ${month}월`;
  if (!WORKER_URL || WORKER_SECRET.includes('여기에')) {
    calStatus.textContent = 'widget 코드 상단의 WORKER_URL / WORKER_SECRET을 먼저 채워주세요';
    return;
  }
  calStatus.textContent = '불러오는 중...';
  const monthStr = `${year}-${String(month).padStart(2, '0')}`;
  try {
    const res = await fetch(`${WORKER_URL}?secret=${encodeURIComponent(WORKER_SECRET)}&month=${monthStr}`);
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '불러오기 실패');
    renderAlbums(data.albums || []);
    calStatus.textContent = '';
  } catch (err) {
    calStatus.textContent = '불러오기 실패: ' + err.message;
    renderAlbums([]);
  }
}

function renderAlbums(albums) {
  albumCount.textContent = `${albums.length}장`;
  albumGrid.innerHTML = '';
  albums.forEach(a => {
    const div = document.createElement('div');
    div.className = 'album-cover';
    div.title = a.title || '';
    div.innerHTML = a.cover ? `<img src="${a.cover}">` : '';
    if (a.pageUrl) {
      div.style.cursor = 'pointer';
      div.addEventListener('click', () => window.open(a.pageUrl, '_blank'));
    }
    albumGrid.appendChild(div);
  });
}

document.getElementById('prevMonth').addEventListener('click', () => {
  viewMonth -= 1;
  if (viewMonth < 1) { viewMonth = 12; viewYear -= 1; }
  loadMonth(viewYear, viewMonth);
});

document.getElementById('nextMonth').addEventListener('click', () => {
  viewMonth += 1;
  if (viewMonth > 12) { viewMonth = 1; viewYear += 1; }
  loadMonth(viewYear, viewMonth);
});

document.getElementById('todayBtn').addEventListener('click', () => {
  viewYear = now.getFullYear();
  viewMonth = now.getMonth() + 1;
  loadMonth(viewYear, viewMonth);
});

loadMonth(viewYear, viewMonth);
</script>
</body>
</html>
